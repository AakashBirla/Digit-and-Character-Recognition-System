[tool:pytest]
testpaths = tests
# The -p no:... flags disable ROS 2 pytest plugins that leak in through PYTHONPATH on this machine.
addopts = -p no:launch_ros -p no:launch_testing -p no:launch_pytest -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint
markers =
    data: needs the downloaded MNIST / EMNIST datasets in data/ (skipped when they are absent)
    gpu: needs a CUDA-capable GPU (skipped when unavailable)
    slow: takes more than a few seconds

[flake8]
max-line-length = 120
exclude = .venv,.git,__pycache__,data,models,results,checkpoints
